<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ASPECT = 1672/940, W = 16, H = W/ASPECT;
// centro del halo sobre la cabeza (coordenadas del plano de la imagen)
const PXW=1672, PXH=940;
// medido sobre la imagen de referencia (la cabeza en la base está 33px más arriba)
const cx = (730/PXW-0.5)*W, cy = (0.5-72/PXH)*H, rx = 2.26, ry = 0.67, tilt = 0.32;
// región que cubre el overlay ASCII
const RWd = 6.4, RHt = 3.0;
const COLS = 190, ROWS = Math.round(COLS*RHt/RWd/2), SS = 3;
const RW = COLS*SS, RH = ROWS*SS, CW = 8, CH = 16;

// posiciona el overlay exactamente sobre esa región de la imagen
// silueta de la cabeza (px de la imagen): lo que queda "delante" del halo trasero
const head=[[690,25],[740,16],[792,35],[822,70],[842,120],[852,170],[852,215],[700,215],[668,170],[662,120],[670,70]];
const cut=document.getElementById('cut');
cut.style.clipPath='polygon('+head.map(p=>(p[0]/PXW*100)+'% '+(p[1]/PXH*100)+'%').join(',')+')';
const out = document.getElementById('out'), outF = document.getElementById('outF');
for(const o of [out,outF]){ o.style.left   = ((cx-RWd/2)/W+0.5)*100+'%';
o.style.top    = (0.5-(cy+RHt/2)/H)*100+'%';
o.style.width  = RWd/W*100+'%';
o.style.height = RHt/H*100+'%';
o.width = COLS*CW; o.height = ROWS*CH;
const c2 = o.getContext('2d');
c2.font = `bold ${CH}px ui-monospace,Menlo,Consolas,monospace`;
c2.textBaseline = 'top'; }
const ctxB = out.getContext('2d'), ctxF = outF.getContext('2d');

// three.js: solo el halo, sobre negro
const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setSize(RW, RH, false);
renderer.setClearColor(0x000000);
const gl = renderer.getContext();
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(cx-RWd/2, cx+RWd/2, cy+RHt/2, cy-RHt/2, 0.1, 50);
camera.position.z = 10;

function cursorTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d'); x.scale(2,2);
  x.beginPath();
  [[8,4],[8,46],[19,36],[27,54],[34,51],[26,34],[41,34]].forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
  x.closePath();
  x.shadowColor='#2eff4a'; x.shadowBlur=8; x.lineWidth=3; x.strokeStyle='#2eff4a'; x.stroke();
  x.fillStyle='#fff'; x.fill();
  return new THREE.CanvasTexture(c);
}
const tex = cursorTex();
const N = 11, arrows = [];
for(let i=0;i<N;i++){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  s.renderOrder = 2; scene.add(s); arrows.push(s);
}
function ringHalf(front){
  const p=[];
  for(let i=0;i<140;i++){ const a=i/140*Math.PI*2, d=Math.sin(a);
    if((d>0)===front) p.push(new THREE.Vector3(cx+rx*Math.cos(a), cy+ry*d+tilt*Math.cos(a), 0)); }
  const r=new THREE.Points(new THREE.BufferGeometry().setFromPoints(p),
    new THREE.PointsMaterial({color:0x2eff4a, size:0.1/RWd*RW, sizeAttenuation:false, transparent:true, depthTest:false}));
  r.renderOrder=1; scene.add(r); return r;
}
const ringB = ringHalf(false), ringF = ringHalf(true);

// ASCII: sólo se dibujan los caracteres del halo, el resto queda transparente
const RAMP = " .:-=+*#%@", L = RAMP.length;
const pal = [];
for(let l=0;l<L;l++) pal.push(`rgb(${Math.round(120+l*15)},${Math.round(150+l*11)},${Math.round(120+l*15)})`);
for(let l=0;l<L;l++) pal.push(`rgb(${Math.round(l*8)},${Math.round(130+l*14)},${Math.round(30+l*8)})`);
const buf = new Uint8Array(RW*RH*4);
const lists = pal.map(()=>[]);

function toAscii(ctx){
  gl.readPixels(0,0,RW,RH,gl.RGBA,gl.UNSIGNED_BYTE,buf);
  lists.forEach(a=>a.length=0);
  ctx.clearRect(0,0,COLS*CW,ROWS*CH);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    let R=0,G=0,B=0;
    for(let j=0;j<SS;j++) for(let i=0;i<SS;i++){
      const k=((RH-1-(r*SS+j))*RW + c*SS+i)*4; R+=buf[k];G+=buf[k+1];B+=buf[k+2];
    }
    const n=SS*SS; R/=n;G/=n;B/=n;
    const lum=(0.3*R+0.59*G+0.11*B)/255;
    const lv=Math.floor(Math.min(1,Math.pow(lum*2.2,0.7))*(L-1));
    if(lv<=1) continue;
    const green = G>R*1.3 && G>B*1.3;
    lists[(green?L:0)+lv].push(c*CW, r*CH, lv);
  }
  ctx.shadowColor='#2eff4a'; ctx.shadowBlur=6;
  for(let p=0;p<pal.length;p++){
    const a=lists[p]; if(!a.length) continue;
    ctx.fillStyle=pal[p];
    for(let q=0;q<a.length;q+=3) ctx.fillText(RAMP[a[q+2]], a[q], a[q+1]);
  }
}

const t0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const t=(now-t0)/1000;
  const ds=[];
  for(let i=0;i<N;i++){
    const a = -t*0.9 + i/N*Math.PI*2, d = Math.sin(a), s = arrows[i];
    ds.push(d);
    s.position.set(cx+rx*Math.cos(a), cy+ry*d+tilt*Math.cos(a), 1);
    const sc = 0.44+0.17*d; s.scale.set(sc,sc,1);
    s.material.opacity = 0.7+0.3*(d*0.5+0.5);
  }
  const pulse = 0.6+0.3*Math.sin(t*3);
  ringB.material.opacity = ringF.material.opacity = pulse;
  for(const front of [false,true]){
    arrows.forEach((s,i)=>s.visible=((ds[i]>0)===front));
    ringB.visible=!front; ringF.visible=front;
    renderer.render(scene,camera);
    toAscii(front?ctxF:ctxB);
  }
}
requestAnimationFrame(frame);
</script>
